name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        # Integration tests start an embedded PostgreSQL; no service needed.
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: fuzz (smoke)
        run: |
          go test -run='^$' -fuzz=FuzzSQLVerb -fuzztime=20s .
          go test -run='^$' -fuzz=FuzzPrettySQL -fuzztime=20s .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
